<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('CampusConnect', ~{::main})}">
<main>
<div class="page-head">
<div>
<div class="eyebrow">CAMPUSCONNECT WORKSPACE</div>
<h1 th:text="${title}">
</h1>
<p>Date-time entry zone: <span th:text="${timeZone}">
</span>. Annual salary currency: <span th:text="${currency}">
</span>.</p>
</div>
</div>
<div class="panel form-panel">
<form th:action="@{''}" method="post" th:object="${form}">
<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
<div th:each="e:${#fields.allErrors()}" th:text="${e}">
</div>
</div>
<div class="form-grid">
<div>
<label class="form-label" for="title">Announcement title</label>
<input class="form-control" id="title" th:field="*{title}" type="text" required>
</div>
<div>
<label class="form-label" for="publishedAt">Publish at (<span th:text="${timeZone}">
</span>)</label>
<input class="form-control" id="publishedAt" th:field="*{publishedAt}" type="datetime-local" required>
</div>
<div class="span-2">
<label class="form-label" for="body">Announcement text</label>
<textarea class="form-control" id="body" th:field="*{body}">
</textarea>
</div>
</div>
<div class="submit-row d-flex gap-2">
<button class="btn btn-primary">Save changes</button>
<a class="btn btn-light" th:href="@{/dashboard}">Back to workspace</a>
</div>
</form>
<form th:if="${recordId != null}" th:action="@{/staff/announcements/{id}/delete(id=${recordId})}" method="post" class="mt-3" data-confirm="Delete this announcement?">
<button class="btn btn-outline-danger">Delete announcement</button>
</form>
</div>
</main>
</html>
