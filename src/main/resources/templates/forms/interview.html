<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('CampusConnect', ~{::main})}">
<main>
<div class="page-head">
<div>
<div class="eyebrow">CAMPUSCONNECT WORKSPACE</div>
<h1 th:text="${title}">
</h1>
<p>Date-time entry zone: <span th:text="${timeZone}">
</span>. Annual salary currency: <span th:text="${currency}">
</span>.</p>
</div>
</div>
<div class="panel form-panel">
<form th:action="@{''}" method="post" th:object="${form}">
<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
<div th:each="e:${#fields.allErrors()}" th:text="${e}">
</div>
</div>
<div class="form-grid">
<div>
<label class="form-label" for="scheduledAt">Interview date and time (<span th:text="${timeZone}">
</span>)</label>
<input class="form-control" id="scheduledAt" th:field="*{scheduledAt}" type="datetime-local" required>
</div>
<div>
<label class="form-label" for="roundNumber">Round number</label>
<input class="form-control" id="roundNumber" th:field="*{roundNumber}" type="number" min="1" max="20" required>
</div>
<div>
<label class="form-label" for="type">Interview type (technical / HR / aptitude)</label>
<input class="form-control" id="type" th:field="*{type}" type="text" required>
</div>
<div>
<label class="form-label" for="location">Room or meeting details</label>
<input class="form-control" id="location" th:field="*{location}" type="text" required>
</div>
<div class="span-2">
<label class="form-label" for="instructions">Instructions and notes visible to the student</label>
<textarea class="form-control" id="instructions" th:field="*{instructions}">
</textarea>
</div>
</div>
<div class="submit-row d-flex gap-2">
<button class="btn btn-primary">Save changes</button>
<a class="btn btn-light" th:href="@{/dashboard}">Back to workspace</a>
</div>
</form>
</div>
</main>
</html>
