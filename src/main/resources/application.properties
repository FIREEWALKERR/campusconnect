spring.application.name=CampusConnect
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=${RESUME_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${REQUEST_MAX_SIZE:6MB}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
app.resume-directory=${RESUME_DIRECTORY:./data/resumes}
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}
app.currency=${CURRENCY_CODE:INR}
app.contact-email=${PLACEMENT_CONTACT_EMAIL:}
app.salary-buckets=${SALARY_BUCKETS:4}
